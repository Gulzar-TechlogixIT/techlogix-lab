name: OI Services V2 CI

on:
  push:
    branches:
      - main
    paths:
      - "techlogix-services-lab-v2/**"
      - ".github/workflows/ci-v2.yml"

  pull_request:
    branches:
      - main
    paths:
      - "techlogix-services-lab-v2/**"
      - ".github/workflows/ci-v2.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: techlogix-services-lab-v2

    env:
      DB_PASSWORD: ci_dummy_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate JavaScript syntax
        run: |
          node --check oi-gateway/app.js
          node --check oi-attendence/app.js
          node --check oi-core/app.js
          node --check oi-track/app.js
          node --check oi-client/public/app.js

      - name: Validate Docker Compose
        run: docker compose -f compose.yml config -q

      - name: Build all services
        run: docker compose -f compose.yml build

  publish-images:
    name: Build and Push V2 Images
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - context: techlogix-services-lab-v2/oi-client
            image: oi-v2-client

          - context: techlogix-services-lab-v2/oi-gateway
            image: oi-v2-gateway

          - context: techlogix-services-lab-v2/oi-attendence
            image: oi-v2-attendance

          - context: techlogix-services-lab-v2/oi-core
            image: oi-v2-core

          - context: techlogix-services-lab-v2/oi-track
            image: oi-v2-track

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          