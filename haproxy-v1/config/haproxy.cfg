
global
    log stdout format raw local0
    maxconn 2048
    stats socket /var/run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker_dns
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 10s
    hold timeout 10s
    hold refused 10s

# --------------------------------------------------
# APPLICATION ROUTING — UNCHANGED
# --------------------------------------------------

frontend http_front
    bind *:80
    acl is_api path_beg /api/
    use_backend api_versions if is_api
    default_backend ui_versions

backend api_versions
    mode http
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 2s fall 3 rise 2

    server v2 oi-gateway-v2:8080 check resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
    server v1 oi-gateway-v1:8080 check backup resolvers docker_dns resolve-prefer ipv4 init-addr libc,none

backend ui_versions
    mode http
    default-server inter 2s fall 3 rise 2

    server v2 oi-client-v2:80 track api_versions/v2 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
    server v1 oi-client-v1:80 check backup resolvers docker_dns resolve-prefer ipv4 init-addr libc,none

# --------------------------------------------------
# POSTGRESQL WRITE — CURRENT PRIMARY
# --------------------------------------------------

backend postgres_primary
    mode tcp
    option httpchk
    http-check send meth GET uri /primary ver HTTP/1.1
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions

    server patroni-1 patroni-1:5432 check port 8008 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
    server patroni-2 patroni-2:5432 check port 8008 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none

frontend postgres_write
    mode tcp
    option tcplog
    bind *:5432
    default_backend postgres_primary

# --------------------------------------------------
# POSTGRESQL READ — CURRENT STANDBY
# --------------------------------------------------

backend postgres_replica
    mode tcp
    option httpchk
    http-check send meth GET uri /replica ver HTTP/1.1
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions

    server patroni-1 patroni-1:5432 check port 8008 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
    server patroni-2 patroni-2:5432 check port 8008 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none

# --------------------------------------------------
# POSTGRESQL READ FALLBACK — CURRENT PRIMARY
# --------------------------------------------------

backend postgres_read_primary_fallback
    mode tcp
    option httpchk
    http-check send meth GET uri /primary ver HTTP/1.1
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions

    server patroni-1 patroni-1:5432 check port 8008 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
    server patroni-2 patroni-2:5432 check port 8008 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none

frontend postgres_read
    mode tcp
    option tcplog
    bind *:5433

    acl no_replica_available nbsrv(postgres_replica) eq 0
    use_backend postgres_read_primary_fallback if no_replica_available
    default_backend postgres_replica















