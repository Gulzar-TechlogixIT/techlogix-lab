global
    log stdout format raw local0
    maxconn 2000
    stats socket /tmp/haproxy-admin.sock level admin
    stats timeout 2m

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend public_http
    bind *:80

    acl is_api path_beg /api/

    use_backend v2_gateway if is_api
    default_backend v2_client

backend v2_client
    option httpchk GET /
    server v2-client oi-client-v2:80 check

backend v2_gateway
    option httpchk GET /health
    http-check expect status 200
    server v2-gateway oi-gateway-v2:8080 check
