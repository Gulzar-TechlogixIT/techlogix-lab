name: Techlogix OI - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and Build
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ci_dummy_password
      REPLICATION_PASSWORD: ci_dummy_replication_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install YAML validator
        run: pip install PyYAML

      - name: Validate JavaScript syntax
        run: |
          find Updated_v1 Updated_v2 haproxy-v1 \
            -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

      - name: Validate Docker Compose files
        run: |
          files=(
            Updated_v1/compose.yml
            Updated_v1/database/compose.yml
            Updated_v2/compose.yml
            Updated_v2/database/compose.yml
            haproxy-v1/compose.yml
            techlogix-db/compose.yml
            techlogix-db/patroni/compose.yml
          )

          for file in "${files[@]}"; do
            echo "Validating $file"
            docker compose -f "$file" config -q
          done

      - name: Validate Patroni YAML template
        run: |
          python -c "import yaml; yaml.safe_load(open('techlogix-db/patroni/patroni.yml.template')); print('Patroni YAML is valid')"

      - name: Validate HAProxy configuration
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/haproxy-v1/config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            haproxy:3.2-alpine \
            haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

      - name: Build Updated V1
        run: docker compose -f Updated_v1/compose.yml build

      - name: Build Updated V2
        run: docker compose -f Updated_v2/compose.yml build

      - name: Build HAProxy services
        run: docker compose -f haproxy-v1/compose.yml build

      - name: Build Patroni image
        run: docker compose -f techlogix-db/patroni/compose.yml build patroni-1
