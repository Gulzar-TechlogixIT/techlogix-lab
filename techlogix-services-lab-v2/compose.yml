services:
  oi-client:
    build: ./oi-client
    restart: unless-stopped
    networks:
      tech-v2-net:
      tech-shared:
        aliases:
          - oi-client-v2

  oi-gateway:
    build: ./oi-gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      ATTENDANCE_URL: "http://oi-attendence:8080"
      CORE_URL: "http://oi-core:8080"
    depends_on:
      - oi-attendence
      - oi-core
    networks:
      tech-v2-net:
      tech-shared:
        aliases:
          - oi-gateway-v2

  oi-attendence:
    build: ./oi-attendence
    restart: unless-stopped
    environment:
      PORT: "8080"
      CORE_URL: "http://oi-core:8080"
      DB_HOST: oi-db
      DB_PORT: "5432"
      DB_NAME: techlogix_lab
      DB_USER: app_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      DB_SCHEMA: attendance
      SERVICE_NAME: oi-attendence
    networks:
      - tech-v2-net
      - tech-db-net

  oi-core:
    build: ./oi-core
    restart: unless-stopped
    environment:
      PORT: "8080"
      TRACK_URL: "http://oi-track:8080"
      DB_HOST: oi-db
      DB_PORT: "5432"
      DB_NAME: techlogix_lab
      DB_USER: app_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      DB_SCHEMA: core
      SERVICE_NAME: oi-core
    networks:
      - tech-v2-net
      - tech-core-track-net
      - tech-db-net

  oi-track:
    build: ./oi-track
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_HOST: oi-db
      DB_PORT: "5432"
      DB_NAME: techlogix_lab
      DB_USER: app_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      DB_SCHEMA: track
      SERVICE_NAME: oi-track
    networks:
      - tech-core-track-net
      - tech-db-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  tech-shared:
    external: true
    name: tech-shared

  tech-v2-net:
    name: tech-v2-net
    driver: bridge
    internal: true

  tech-core-track-net:
    name: tech-core-track-net
    driver: bridge
    internal: true

  tech-db-net:
    external: true
    name: tech-db-net




