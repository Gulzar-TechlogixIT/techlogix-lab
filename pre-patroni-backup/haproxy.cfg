global
    log stdout format raw local0
    maxconn 2048
    stats socket /var/run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    log global
    mode http
    option httplog
    option dontlognull

    timeout connect 5s
    timeout client 60s
    timeout server 60s


# Docker embedded DNS: re-resolve container names dynamically
resolvers docker_dns
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 10s
    hold timeout 10s
    hold refused 10s

frontend http_front
    bind *:80

    acl is_api path_beg /api/
    use_backend api_versions if is_api
    default_backend ui_versions

# API: V2 primary, V1 backup
backend api_versions
    mode http

    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200

    default-server inter 2s fall 3 rise 2

    server v2 oi-gateway-v2:8080 check resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
    server v1 oi-gateway-v1:8080 check backup resolvers docker_dns resolve-prefer ipv4 init-addr libc,none

# UI follows API version health
backend ui_versions
    mode http

    default-server inter 2s fall 3 rise 2

    server v2 oi-client-v2:80 track api_versions/v2 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
    server v1 oi-client-v1:80 check backup resolvers docker_dns resolve-prefer ipv4 init-addr libc,none


# PostgreSQL WRITE: only the current PRIMARY is eligible.
# Role-agent checks use a separate check address, while client traffic
# continues to the PostgreSQL server address.
backend postgres_primary
    mode tcp
    default-server inter 3s fall 3 rise 2

    server primary oi-db:5432 check agent-check agent-addr 192.168.0.17 agent-port 9101 agent-inter 3s resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
    server replica oi-db-replica:5432 check agent-check agent-addr 192.168.0.17 agent-port 9103 agent-inter 3s resolvers docker_dns resolve-prefer ipv4 init-addr libc,none

frontend postgres_write
    mode tcp
    option tcplog
    bind *:5432
    default_backend postgres_primary


# PostgreSQL READ: only the current STANDBY is eligible.
backend postgres_replica
    mode tcp
    default-server inter 3s fall 3 rise 2

    server primary oi-db:5432 check agent-check agent-addr 192.168.0.17 agent-port 9102 agent-inter 3s resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
    server replica oi-db-replica:5432 check agent-check agent-addr 192.168.0.17 agent-port 9104 agent-inter 3s resolvers docker_dns resolve-prefer ipv4 init-addr libc,none

frontend postgres_read
    mode tcp
    option tcplog
    bind *:5433
    default_backend postgres_replica
