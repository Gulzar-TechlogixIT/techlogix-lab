
services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: patroni-etcd-1
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=techlogix-patroni
    volumes:
      - etcd1_data:/etcd-data
    networks: [patroni-net]
    restart: unless-stopped

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: patroni-etcd-2
    command:
      - /usr/local/bin/etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=techlogix-patroni
    volumes:
      - etcd2_data:/etcd-data
    networks: [patroni-net]
    restart: unless-stopped

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: patroni-etcd-3
    command:
      - /usr/local/bin/etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=techlogix-patroni
    volumes:
      - etcd3_data:/etcd-data
    networks: [patroni-net]
    restart: unless-stopped

  patroni-1:
    build: .
    image: techlogix-patroni:16
    container_name: patroni-db-1
    hostname: patroni-1
    user: postgres
    restart: unless-stopped
    environment:
      PATRONI_NAME: patroni-1
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD}
    volumes:
      - patroni1_data:/var/lib/postgresql/data
    networks:
      patroni-net:
        aliases:
          - patroni-1
      tech-db-net:
        aliases:
          - patroni-1
    depends_on:
      - etcd-1
      - etcd-2
      - etcd-3

  patroni-2:
    build: .
    image: techlogix-patroni:16
    container_name: patroni-db-2
    hostname: patroni-2
    user: postgres
    restart: unless-stopped
    environment:
      PATRONI_NAME: patroni-2
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD}
    volumes:
      - patroni2_data:/var/lib/postgresql/data
    networks:
      patroni-net:
        aliases:
          - patroni-2
      tech-db-net:
        aliases:
          - patroni-2
    depends_on:
      - etcd-1
      - etcd-2
      - etcd-3

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  patroni1_data:
  patroni2_data:

networks:
  patroni-net:
    name: techlogix-patroni-net

  tech-db-net:
    external: true
    name: tech-db-net
